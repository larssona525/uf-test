backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "nyheter"
    label: "Nyheter"
    folder: "content/nyheter"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Rubrik"
        name: "title"
        widget: "string"

      - label: "Datum"
        name: "date"
        widget: "datetime"

      - label: "Text"
        name: "body"
        widget: "markdown"